name: Build SvoyBloknot

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.name }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: windows-latest
            name: "Windows x64"
            artifact_name: "windows-x64"
            kernel_path: "../app/kernel/SiYuan-Kernel.exe"
            electron_args: "dist"
            goos: "windows"
            goarch: "amd64"
            artifact_glob: "app/build/svoybloknot-*-win.exe*"
          - os: macos-latest
            name: "macOS x64 (Intel)"
            artifact_name: "macos-x64"
            kernel_path: "../app/kernel-darwin/SiYuan-Kernel"
            electron_args: "dist-darwin"
            goos: "darwin"
            goarch: "amd64"
            artifact_glob: "app/build/svoybloknot-*-mac.dmg*"
          - os: macos-latest
            name: "macOS arm64 (Apple Silicon)"
            artifact_name: "macos-arm64"
            kernel_path: "../app/kernel-darwin-arm64/SiYuan-Kernel"
            electron_args: "dist-darwin-arm64"
            goos: "darwin"
            goarch: "arm64"
            artifact_glob: "app/build/svoybloknot-*-mac-arm64.dmg*"
          - os: ubuntu-latest
            name: "Linux x64"
            artifact_name: "linux-x64"
            kernel_path: "../app/kernel-linux/SiYuan-Kernel"
            electron_args: "dist-linux"
            goos: "linux"
            goarch: "amd64"
            artifact_glob: "app/build/svoybloknot-*-linux.*"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: kernel/go.mod
          cache-dependency-path: kernel/go.sum
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install RPM build tools (Linux)
        if: matrix.config.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install Node dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: app

      - name: Build UI
        run: pnpm run build
        working-directory: app

      - name: Build kernel (fts5 + sqlcipher)
        run: go build -tags "fts5 sqlcipher" -o "${{ matrix.config.kernel_path }}" -ldflags "-s -w"
        working-directory: kernel
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.config.goos }}
          GOARCH: ${{ matrix.config.goarch }}

      - name: Build Electron app
        run: pnpm run ${{ matrix.config.electron_args }}
        working-directory: app

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: svoybloknot-${{ matrix.config.artifact_name }}
          path: ${{ matrix.config.artifact_glob }}
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          prerelease: true
          files: |
            svoybloknot-*/**

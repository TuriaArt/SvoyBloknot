name: Build SvoyBloknot

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.name }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: windows-latest
            name: "Windows x64"
            kernel_path: "../app/kernel/SiYuan-Kernel.exe"
            electron_args: "dist"
            goos: "windows"
            goarch: "amd64"
            artifact_glob: "app/build/svoybloknot-*-win.exe*"
          - os: macos-latest
            name: "macOS x64 (Intel)"
            kernel_path: "../app/kernel-darwin/SiYuan-Kernel"
            electron_args: "dist-darwin"
            goos: "darwin"
            goarch: "amd64"
            artifact_glob: "app/build/svoybloknot-*-mac.dmg*"
          - os: macos-latest
            name: "macOS arm64 (Apple Silicon)"
            kernel_path: "../app/kernel-darwin-arm64/SiYuan-Kernel"
            electron_args: "dist-darwin-arm64"
            goos: "darwin"
            goarch: "arm64"
            artifact_glob: "app/build/svoybloknot-*-mac-arm64.dmg*"
          - os: ubuntu-latest
            name: "Linux x64"
            kernel_path: "../app/kernel-linux/SiYuan-Kernel"
            electron_args: "dist-linux"
            goos: "linux"
            goarch: "amd64"
            artifact_glob: "app/build/svoybloknot-*-linux.*"

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: kernel/go.mod
          cache-dependency-path: kernel/go.sum
          cache: true

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install RPM build tools (Linux)
        if: matrix.config.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install Node dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: app

      - name: Build UI
        run: pnpm run build
        working-directory: app

      - name: Build kernel (fts5 + sqlcipher)
        run: go build -tags "fts5 sqlcipher" -o "${{ matrix.config.kernel_path }}" -ldflags "-s -w"
        working-directory: kernel
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.config.goos }}
          GOARCH: ${{ matrix.config.goarch }}

      - name: Build Electron app
        run: pnpm run ${{ matrix.config.electron_args }}
        working-directory: app

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: svoybloknot-${{ matrix.config.goos }}-${{ matrix.config.goarch }}
          path: ${{ matrix.config.artifact_glob }}
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          prerelease: true
          files: |
            svoybloknot-*/**

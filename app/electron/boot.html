<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SvoyBloknot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <style>
        html {
            overflow: hidden;
            height: 100%;
        }

        body {
            height: 100%;
            margin: 0;
            background: #1e1e1e;
            font-size: 12px;
            font-family: "Helvetica Neue", "Luxi Sans", "DejaVu Sans", "Hiragino Sans GB", "Microsoft Yahei", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Segoe UI Symbol", "Android Emoji", "EmojiSymbols";
        }

        #bg {
            width: 100%;
            display: flex;
            justify-content: space-around;
            height: 100%;
        }

        #bg img {
            width: 48vh;
            height: 48vh;
            align-self: center;
            border-radius: 12%;
            opacity: 0;
            transform: scale(0.9);
            filter: drop-shadow(0 0 16px rgba(155, 89, 182, 0.55));
            animation: bootLogoForm 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
        }

        @keyframes bootLogoForm {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* 底部进度区，预留安全区域防止移动端手势条遮挡 */
        #progressWrap {
            position: absolute;
            bottom: env(safe-area-inset-bottom);
            width: 100%;
            padding-bottom: env(safe-area-inset-bottom);
        }

        #progressTrack {
            position: absolute;
            height: 2px;
            background-color: #2a2c2f;
            width: 100%;
            top: 0;
        }

        #progress {
            position: absolute;
            height: 2px;
            background-color: #3b3e43;
            box-shadow: 0 0 8px rgba(59, 62, 67, 0.6);
            transition: width 0.6s cubic-bezier(0, 0, 0.2, 1);
            top: 0;
            width: 0;
        }

        #details {
            color: #9aa0a6;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
            padding: 8px;
            height: 16px;
            line-height: 16px;
        }
    </style>
</head>
<body>
<div id="bg">
    <img src="boot-icon.png" alt="SvoyBloknot LOGO">
</div>
<div id="progressWrap">
    <div id="progressTrack"></div>
    <div id="progress"></div>
    <div id="details"></div>
</div>
<script>
    const getSearch = (key) => {
        if (window.location.search.indexOf('?') === -1) {
            return ''
        }
        let value = ''
        const data = window.location.search.split('?')[1].split('&')
        data.find(item => {
            const keyValue = item.split('=')
            if (keyValue[0] === key) {
                value = keyValue[1]
                return true
            }
        })
        return value
    }
    (async () => {
        const v = getSearch('v')
        const port = getSearch('port') || '6806'
        const progressEl = document.getElementById('progress')
        const detailsEl = document.getElementById('details')
        detailsEl.textContent = "v" + v + ' Booting kernel...'

        // 随机起始基数（15~25），等待内核进度时先平滑填充到此值
        const baseProgress = 15 + Math.random() * 10

        // 当前进度只增不减，避免内核首帧进度小于初始基数时进度条倒退回 0
        let currentDisplay = 0
        const setProgress = (target) => {
            if (target > currentDisplay) {
                currentDisplay = target
                progressEl.style.width = target + '%'
            }
        }
        // 先平滑填充到随机基数，延迟两帧确保浏览器先渲染 width:0 再触发过渡
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                setProgress(baseProgress)
            })
        })

        let progressing = false
        const subscribe = () => {
            const es = new EventSource('http://127.0.0.1:' + port + '/api/system/bootProgressSSE')
            es.onmessage = (event) => {
                const progressData = JSON.parse(event.data)
                // 内核进度按比例映射到 baseProgress~100 区间，从当前显示值继续递增
                const display = baseProgress + progressData.progress * (100 - baseProgress) / 100
                setProgress(display)
                detailsEl.textContent = progressData.details
                if (progressData.progress >= 100) {
                    progressing = true
                    es.close()
                    // Ничего доигрывать не нужно (статичная иконка) — окно закроет main.js сам по готовности
                }
            }
            es.onerror = () => {
                es.close()
                // 内核启动早期 HTTP 服务可能尚未就绪，EventSource 原生重连间隔较长（约 3s），
                // 这里主动短延迟重连，保持与原轮询一致的快速重试语义
                if (!progressing) {
                    setTimeout(subscribe, 100)
                }
            }
        }
        subscribe()
    })()
</script>
</body>
</html>
